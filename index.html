<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0f0 100%);
            min-height: 100vh;
        }

        /* Floating hearts animation */
        .hearts-container {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            animation: float 8s infinite;
            opacity: 0.6;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Card Container */
        .card-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 2000px;
            z-index: 2;
        }

        /* Card wrapper for 3D effect */
        .card {
            position: relative;
            width: 90%;
            max-width: 800px;
            height: 90vh;
            max-height: 650px;
            transform-style: preserve-3d;
            transition: transform 1.5s;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .card {
                width: 95%;
                height: 85vh;
                max-height: none;
            }
        }

        .card.opened {
            transform: rotateY(180deg);
        }

        /* Card front (cover) */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.4);
        }

        .card-front {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 50%, #ffc4d6 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 40px 20px;
            border: 3px solid #ff1493;
        }

        .card-front h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: pulse 2s infinite;
            text-align: center;
        }

        @media (max-width: 768px) {
            .card-front {
                padding: 20px 15px;
            }
            
            .card-front h1 {
                font-size: 1.8em;
                margin-bottom: 15px;
            }

            .card-front p {
                font-size: 1em;
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .card-front p {
            font-size: 1.3em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .tap-hint {
            margin-top: 30px;
            font-size: 1.5em;
            background: white;
            padding: 15px 35px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.3);
            animation: bounce 2s infinite;
            font-weight: bold;
            color: #ff1493;
            position: relative;
            display: inline-block;
        }

        .tap-hint::before,
        .tap-hint::after {
            position: absolute;
            font-size: 1.5em;
            animation: heartbeat 1.5s infinite;
        }

        .tap-hint::before {
            content: '💕';
            left: -40px;
            top: 50%;
            transform: translateY(-50%);
        }

        .tap-hint::after {
            content: '💕';
            right: -40px;
            top: 50%;
            transform: translateY(-50%);
        }

        @media (max-width: 768px) {
            .tap-hint {
                font-size: 1.1em;
                padding: 12px 25px;
                margin-top: 20px;
            }

            .tap-hint::before {
                left: -30px;
                font-size: 1.2em;
            }

            .tap-hint::after {
                right: -30px;
                font-size: 1.2em;
            }
        }

        @keyframes bounce {
            0%, 100% { 
                transform: translateY(0px);
                box-shadow: 0 10px 30px rgba(255, 20, 147, 0.3);
            }
            50% { 
                transform: translateY(-10px);
                box-shadow: 0 20px 40px rgba(255, 20, 147, 0.5);
            }
        }

        @keyframes heartbeat {
            0%, 100% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(1.3); }
        }

        @keyframes blink {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.3; }
        }

        /* Card back (inside) */
        .card-back {
            background: linear-gradient(135deg, #fff5f8 0%, #ffe8f0 100%);
            transform: rotateY(180deg);
            padding: 20px 15px;
            overflow: hidden;
            border: 3px solid #ff69b4;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .card-back {
                padding: 15px 10px;
            }
        }

        .card-content {
            text-align: center;
            width: 100%;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-content h2 {
            color: #ff1493;
            font-size: 1.8em;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(255, 20, 147, 0.2);
        }

        /* Photo gallery */
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        @media (max-width: 768px) {
            .photo-gallery {
                grid-template-columns: 1fr;
                gap: 8px;
                margin: 10px 0;
            }
        }

        .photo-frame {
            background: white;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.3);
            transform: rotate(-2deg);
            transition: transform 0.3s;
        }

        .photo-frame:nth-child(even) {
            transform: rotate(2deg);
        }

        .photo-frame:hover {
            transform: rotate(0deg) scale(1.05);
        }

        .photo-frame img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            border-radius: 5px;
            background: #f9f9f9;
        }

        @media (max-width: 768px) {
            .photo-frame {
                padding: 6px;
                transform: rotate(0deg) !important;
            }

            .photo-frame img {
                height: 200px;
            }
        }

        /* Message section */
        .message {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin: 15px 0 10px 0;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.2);
            border-left: 5px solid #ff1493;
        }

        .message p {
            color: #ff1493;
            font-size: 1.2em;
            line-height: 1.6;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .message {
                padding: 15px;
                margin: 10px 0 5px 0;
            }

            .message p {
                font-size: 1em;
                line-height: 1.5;
            }
        }

        /* Decorative elements */
        .decoration {
            position: absolute;
            font-size: 30px;
            opacity: 0.3;
            animation: rotate 10s infinite linear;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .card-content h2 {
                font-size: 1.3em;
                margin-bottom: 8px;
            }

            .decoration {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating hearts background -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Valentine Card -->
    <div class="card-container">
        <div class="card" id="valentineCard">
            <!-- Card Front -->
            <div class="card-front">
                <div class="decoration" style="top: 10%; left: 10%;">💕</div>
                <div class="decoration" style="top: 15%; right: 15%;">💝</div>
                <div class="decoration" style="bottom: 10%; left: 15%;">🌹</div>
                <div class="decoration" style="bottom: 15%; right: 10%;">💖</div>
                
                <h1>❤️ Happy Valentine's Day ❤️</h1>
                <p>Untuk orang terspesial di hidupku...</p>
                <div class="tap-hint">
                    ✨ Buka dong ✨
                </div>
            </div>

            <!-- Card Back (Inside) -->
            <div class="card-back">
                <div class="card-content">
                    <h2>💌 Untuk Sayangku 💌</h2>

                    <!-- Photo Gallery -->
                    <div class="photo-gallery">
                        <div class="photo-frame">
                            <img src="foto1.jpg" alt="Our Photo 1">
                        </div>
                        <div class="photo-frame">
                            <img src="foto2.jpg" alt="Our Photo 2">
                        </div>
                        <div class="photo-frame">
                            <img src="foto3.jpg" alt="Our Photo 3">
                        </div>
                    </div>

                    <!-- Message -->
                    <div class="message">
                        <p>
                            Selamat Valentine sayang,<br>
                            aku sayang kamu ❤️
                        </p>
                    </div>

                    <div style="margin-top: 20px; color: #ff69b4;">
                        <p>💕 Dengan cinta 💕</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Create floating hearts
        const heartsContainer = document.getElementById('heartsContainer');
        const heartSymbols = ['❤️', '💕', '💖', '💗', '💝', '💘', '🌹', '💐'];
        
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heartsContainer.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 13000);
        }

        // Create hearts periodically
        setInterval(createHeart, 500);
        
        // Create initial hearts
        for(let i = 0; i < 10; i++) {
            createHeart();
        }

        // Card flip functionality
        const card = document.getElementById('valentineCard');
        card.addEventListener('click', function() {
            this.classList.toggle('opened');
        });
    </script>
</body>
</html>
